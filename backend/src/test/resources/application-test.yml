# Perfil de pruebas: BD en memoria H2 (modo PostgreSQL), sin Flyway, esquema generado por Hibernate.
spring:
  datasource:
    url: jdbc:h2:mem:cursos_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          import_files: ""   # no ejecutar import.sql legado; los datos los crea DataInitializer

