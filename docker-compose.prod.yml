version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cursos_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - app_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cursos_api
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CULQI_SECRET_KEY=${CULQI_SECRET_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - CULQI_PUBLIC_KEY=${CULQI_PUBLIC_KEY}
    networks:
      - app_network
    depends_on:
      - db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cursos_web
    restart: always
    networks:
      - app_network
    depends_on:
      - api

  nginx-proxy:
    image: nginx:alpine
    container_name: cursos_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx-prod.conf:/etc/nginx/conf.d/default.conf
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - app_network
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: cursos_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  certbot_data:
  certbot_www:
